    --c-sin:#a9781f; --c-sin-soft:#f3e8d2;
    --c-lon:#48598c; --c-lon-soft:#e2e5f2;
    --c-par:#9c4e69; --c-par-soft:#f2e1e7;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#11181a;
      --ink:#eef1ee;
      --ink-soft:#a9b6b1;
      --ink-faint:#647672;
      --line:#28312f;
      --surface:#1a2223;
      --surface-2:#202a29;
      --accent:#63d3d8;
      --accent-ink:#0b2224;
      --accent-soft:#1b3638;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px rgba(0,0,0,.35);

      --c-tpe:#74c290; --c-tpe-soft:#1c3327;
      --c-sin:#e0ac4d; --c-sin-soft:#3a2f18;
      --c-lon:#93a2e0; --c-lon-soft:#232a45;
      --c-par:#e197b0; --c-par-soft:#3a222c;
    }
  }
  :root[data-theme="dark"]{
    --paper:#11181a; --ink:#eef1ee; --ink-soft:#a9b6b1; --ink-faint:#647672; --line:#28312f;
    --surface:#1a2223; --surface-2:#202a29; --accent:#63d3d8; --accent-ink:#0b2224; --accent-soft:#1b3638;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px rgba(0,0,0,.35);
    --c-tpe:#74c290; --c-tpe-soft:#1c3327;
    --c-sin:#e0ac4d; --c-sin-soft:#3a2f18;
    --c-lon:#93a2e0; --c-lon-soft:#232a45;
    --c-par:#e197b0; --c-par-soft:#3a222c;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Noto Sans TC','IBM Plex Sans','PingFang TC',sans-serif;
    padding-inline:16px; padding-block:0 96px;
    display:flex; flex-direction:column; align-items:center;
  }
  .wrap{width:100%; max-width:460px; display:flex; flex-direction:column; min-height:100dvh;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}

  /* ---- header ---- */
  header{position:sticky; top:0; z-index:5; background:var(--paper); padding-block:14px 10px; border-bottom:1px solid var(--line);}
  .header-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .trip-title{font-family:'Noto Serif TC',serif; font-weight:700; font-size:1.32rem; margin:0; letter-spacing:.01em;}
  .pin-btn{
    flex:none; display:flex; align-items:center; gap:5px; text-decoration:none;
    background:var(--accent-soft); color:var(--accent); font-size:.82rem; font-weight:700;
    padding:7px 12px; border-radius:99px; -webkit-tap-highlight-color:transparent;
  }
  .pin-btn:active{transform:translateY(1px);}
  .trip-sub{margin:4px 0 0; font-size:.86rem; color:var(--ink-soft); display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .trip-sub .pill{
    font-family:'IBM Plex Mono',monospace; font-size:.72rem; font-weight:600; letter-spacing:.02em;
    background:var(--accent-soft); color:var(--accent); border-radius:99px; padding:2px 9px;
  }

  /* ---- day rail ---- */
  .rail{display:flex; gap:8px; overflow-x:auto; padding:12px 2px 4px; scrollbar-width:none;}
  .rail::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:7px 11px 8px; border-radius:12px; border:1px solid var(--line); background:var(--surface);
    cursor:pointer; -webkit-tap-highlight-color:transparent; position:relative; min-width:50px;
  }
  .chip .d{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:.82rem;}
  .chip .w{font-size:.68rem; color:var(--ink-faint);}
  .chip .dot{position:absolute; top:5px; right:6px; width:6px; height:6px; border-radius:50%;}
  .chip.is-active{background:var(--ink); border-color:var(--ink);}
  .chip.is-active .d{color:var(--paper);}
  .chip.is-active .w{color:var(--ink-faint);}
  .chip.is-today{box-shadow:0 0 0 2px var(--accent);}

  /* ---- card (boarding-pass) ---- */
  main{flex:1; padding-block:14px 20px; display:flex; flex-direction:column;}
  .card{
    background:var(--surface); border-radius:18px; box-shadow:var(--shadow);
    padding:20px; position:relative; overflow:hidden; animation:rise .32s ease both;
  }
  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .card{animation:none;} }

  .card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px;}
  .head-date{display:flex; align-items:baseline; gap:8px;}
  .head-date .big{font-family:'Fraunces',serif; font-weight:600; font-size:2.6rem; line-height:1;}
  .head-date .wk{font-size:.98rem; color:var(--ink-soft); font-weight:500;}
  .city-badge{
    font-size:.78rem; font-weight:700; padding:5px 11px; border-radius:99px; white-space:nowrap;
    letter-spacing:.02em;
  }
  .day-title{font-family:'Noto Serif TC',serif; font-weight:700; font-size:1.12rem; margin:2px 0 0;}
  .day-note{font-size:.82rem; color:var(--ink-faint); margin:4px 0 0; line-height:1.6;}

  .timeline{display:flex; flex-direction:column; margin-top:4px;}
  .t-row{display:grid; grid-template-columns:64px 16px 1fr; column-gap:2px;}
  .t-time{font-family:'IBM Plex Mono',monospace; font-size:.74rem; color:var(--ink-soft); padding-top:2px; text-align:right; line-height:1.5; word-break:keep-all;}
  .t-rail{display:flex; flex-direction:column; align-items:center;}
  .t-dot{width:7px; height:7px; border-radius:50%; background:var(--accent); margin-top:6px; flex:none;}
  .t-line{flex:1; width:1px; background:var(--line); margin-top:2px;}
  .t-row:last-child .t-line{display:none;}
  .t-label{font-size:.92rem; line-height:1.6; padding-bottom:14px;}

  .stub-divider{position:relative; height:0; border-top:2px dashed var(--line); margin:6px -20px 16px; }
  .stub-divider::before, .stub-divider::after{
    content:""; position:absolute; top:50%; transform:translateY(-50%);
    width:20px; height:20px; border-radius:50%; background:var(--paper);
  }
  .stub-divider::before{left:-10px;}
  .stub-divider::after{right:-10px;}

  .stub{display:flex; flex-direction:column; gap:10px;}
  .stub-row{display:flex; gap:10px; align-items:flex-start; font-size:.86rem; line-height:1.65;}
  .stub-row .icon{flex:none; font-size:.95rem; margin-top:1px;}
  .stub-row .k{font-weight:600; color:var(--ink-soft); white-space:nowrap;}
  .stub-row .v{color:var(--ink);}
  .stub-row a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-soft); word-break:break-all;}
  .meal-list{display:flex; flex-direction:column; gap:3px;}

  /* ---- bottom nav ---- */
  .navbar{
    position:fixed; left:0; right:0; bottom:0; z-index:6;
    background:var(--surface); border-top:1px solid var(--line);
    display:flex; justify-content:center;
  }
  .navbar-inner{width:100%; max-width:460px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:10px 16px calc(10px + env(safe-area-inset-bottom));}
  .nav-btn{
    background:none; border:none; font-family:'Noto Sans TC',sans-serif; color:var(--ink); font-size:.86rem;
    display:flex; align-items:center; gap:5px; padding:8px 4px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .nav-btn.next{justify-self:end;}
  .nav-btn.prev{justify-self:start;}
  .nav-btn:disabled{opacity:.3;}
  .nav-btn .arrow{font-size:1rem;}
  .today-btn{
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:99px;
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:.76rem; letter-spacing:.03em;
    padding:8px 16px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .today-btn:focus-visible, .nav-btn:focus-visible, .chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
</style>

        {k:'午餐', v:'Ha Noi 1988'},
        {k:'咖啡', v:'雙叟咖啡館（Saint-Germain-des-Prés）'}
      ]
    },
    { iso:'2026-09-27', date:'9/27', wk:'日', city:'transit', route:'巴黎 → 新加坡', title:'飛往新加坡＋夜遊轉機',
      timeline:[
        {t:'09:00', l:'出門，Check out'},
        {t:'09:00–09:30', l:'前往巴黎北站'},
        {t:'09:30–10:00', l:'Gare du Nord 寄放行李（Nannybag）'},
        {t:'10:00–10:15', l:'前往蒙馬特高地'},
        {t:'上午', l:'聖心堂／愛牆（地鐵 2 號線 Anvers 站）；伴手禮採購'},
        {t:'18:00', l:'返程、領行李'},
        {t:'18:00–19:00', l:'前往機場'},
        {t:'19:00–22:35', l:'晚餐、等候出境登機'},
        {t:'22:35', l:'✈️ 起飛：巴黎 → 新加坡'},
        {t:'17:40', l:'抵達新加坡（隔日當地時間，樟宜機場）'},
        {t:'18:30–19:30', l:'星耀樟宜'},
        {t:'20:00–21:30', l:'濱海灣花園（夜間燈光秀 19:45）'},
        {t:'21:30–22:30', l:'魚尾獅公園、金沙夜景'},
        {t:'22:30–00:30', l:'老巴剎沙嗲街：烤沙嗲配啤酒'},
        {t:'01:00後', l:'搭 Grab 回樟宜機場'}
      ],
      meals:[
        {k:'甜點', v:'Berthillon 冰淇淋、Rue Lepic 水果塔、Bachar 開心果冰淇淋、Crêperie Genia 法式薄餅'}
      ]
    },
    { iso:'2026-09-28', date:'9/28', wk:'一', city:'sin', title:'新加坡（轉機延伸）',
      note:'本日無獨立安排，行程緊接 9/27 夜晚的新加坡轉機活動',
      timeline:[
        {t:'凌晨', l:'延續前一晚新加坡夜遊行程，於樟宜機場休息候機'}
      ]
    },
    { iso:'2026-09-29', date:'9/29', wk:'二', city:'transit', route:'新加坡 → 台灣', title:'返回台灣',
      timeline:[
        {t:'00:00', l:'新加坡（樟宜機場）'},
        {t:'07:00', l:'✈️ 起飛：新加坡 → 台灣'},
        {t:'11:45', l:'🎉 抵達台灣'}
      ]
    }
  ];

  var railEl = document.getElementById('rail');
  var cardEl = document.getElementById('card');
  var subEl = document.getElementById('tripSub');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var todayBtn = document.getElementById('todayBtn');

  function todayISO(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  var TODAY = todayISO();
  var todayIdx = DAYS.findIndex(function(d){ return d.iso === TODAY; });
  var idx = todayIdx >= 0 ? todayIdx : 0;

  function buildRail(){
    railEl.innerHTML = '';
    DAYS.forEach(function(d, i){
      var c = CITY[d.city];
      var chip = document.createElement('button');
      chip.className = 'chip';
      chip.setAttribute('role','tab');
      chip.innerHTML =
        '<span class="dot" style="background:'+c.color+'"></span>' +
        '<span class="d">'+d.date+'</span>' +
        '<span class="w">'+d.wk+'</span>';
      if (d.iso === TODAY) chip.classList.add('is-today');
      chip.addEventListener('click', function(){ select(i); });
      railEl.appendChild(chip);
    });
  }

  function tripStatusText(){
    var start = DAYS[0].iso, end = DAYS[DAYS.length-1].iso;
    if (TODAY < start){
      var diff = Math.round((new Date(start) - new Date(TODAY)) / 86400000);
      return '<span class="pill">距出發 '+diff+' 天</span>';
    }
    if (TODAY > end){
      return '<span class="pill">行程已結束</span>';
    }
    return '<span class="pill">TODAY · 第 '+(todayIdx+1)+'／'+DAYS.length+' 天</span>';
  }

  function renderCard(){
    var d = DAYS[idx];
    var c = CITY[d.city];
    var html = '';
    html += '<div class="card-head">';
    html += '<div class="head-date"><span class="big" style="color:'+c.color+'">'+d.date.split('/')[1]+'</span><span class="wk">'+d.wk+'　'+d.date+'</span></div>';
    html += '<span class="city-badge" style="background:'+c.soft+'; color:'+c.color+'">'+ (d.route ? d.route : c.label) +'</span>';
    html += '</div>';
    html += '<h2 class="day-title">'+d.title+'</h2>';
    if (d.note) html += '<p class="day-note">'+d.note+'</p>';

    html += '<div class="timeline">';
    d.timeline.forEach(function(row){
      html += '<div class="t-row">';
      html += '<div class="t-time">'+row.t+'</div>';
      html += '<div class="t-rail"><span class="t-dot" style="background:'+c.color+'"></span><span class="t-line"></span></div>';
      html += '<div class="t-label">'+row.l+'</div>';
      html += '</div>';
    });
    html += '</div>';

    var hasStub = d.meals || d.transport || d.links;
    if (hasStub){
      html += '<div class="stub-divider"></div>';
      html += '<div class="stub">';
      if (d.meals){
        html += '<div class="stub-row"><span class="icon">🍴</span><div class="meal-list">';
        d.meals.forEach(function(m){
          html += '<div><span class="k">'+m.k+'</span> <span class="v">'+m.v+'</span></div>';
        });
        html += '</div></div>';
      }
      if (d.transport){
        html += '<div class="stub-row"><span class="icon">💰</span><span class="v mono" style="font-size:.82rem;">'+d.transport+'</span></div>';
      }
      if (d.links){
        html += '<div class="stub-row"><span class="icon">🔗</span><div class="meal-list">';
        d.links.forEach(function(link){
          html += '<div><a href="'+link.url+'" target="_blank" rel="noopener">'+link.label+'</a></div>';
        });
        html += '</div></div>';
      }
      html += '</div>';
    }

    cardEl.innerHTML = html;
  }

  function updateRailState(){
    var chips = railEl.querySelectorAll('.chip');
    chips.forEach(function(chip, i){
      chip.classList.toggle('is-active', i === idx);
    });
    var active = chips[idx];
    if (active) active.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }

  function updateNav(){
    prevBtn.disabled = idx <= 0;
    nextBtn.disabled = idx >= DAYS.length - 1;
  }

  function select(i){
    idx = Math.max(0, Math.min(DAYS.length - 1, i));
    renderCard();
    updateRailState();
    updateNav();
  }

  prevBtn.addEventListener('click', function(){ select(idx - 1); });
  nextBtn.addEventListener('click', function(){ select(idx + 1); });
  todayBtn.addEventListener('click', function(){ select(todayIdx >= 0 ? todayIdx : 0); });

  window.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') select(idx + 1);
    else if (e.key === 'ArrowLeft') select(idx - 1);
  });

  var touchX = null;
  document.addEventListener('touchstart', function(e){ touchX = e.touches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', function(e){
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 60){ dx < 0 ? select(idx + 1) : select(idx - 1); }
    touchX = null;
  }, {passive:true});

  subEl.innerHTML = tripStatusText();
  buildRail();
  select(idx);
})();
</script>
